        <h1>VisitantHub – Visitor Management Made Effortless</h1>
        <p>VisitantHub is a cloud-based visitor management system for clinics, offices, banks, hospitals, and enterprises across India. Features include digital self-check-in kiosks, live TV display boards, instant WhatsApp notifications, appointment scheduling, real-time analytics, and custom branding.</p>
        <h2>Key Features</h2>
        <ul>
          <li>Smart Visitor Kiosk – self-check-in from any device, no app needed</li>
          <li>Live TV Display Board – real-time queue visible to all visitors</li>
          <li>Instant WhatsApp Alerts – associates notified the moment a visitor checks in</li>
          <li>Appointment Scheduling – book visits in advance with automated confirmations</li>
          <li>Role-Based Access – Super Admin, Company Admin, and Associate roles</li>
          <li>Real-Time Analytics – track visits by day, week, month with Excel export</li>
          <li>Custom Branding – your logo, colours, and kiosk URL</li>
        </ul>
        <h2>Industries Served</h2>
        <p>Banks, NBFCs, Hospitals, Clinics, Corporate Offices, Government Offices, Schools, Colleges, Law Firms, CA Offices, Real Estate, Service Centres, Pharmacies.</p>
        <h2>Pricing</h2>
