plugins {
    id 'com.android.application'
}

android {
    namespace 'com.visitanthub.tv'
    compileSdk 36

    defaultConfig {
        applicationId "com.visitanthub.tv"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file('../../mobile/android/app/visitanthub-release.keystore')
            storePassword 'visitanthub2024'
            keyAlias 'visitanthub'
            keyPassword 'visitanthub2024'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
